<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6F0">
  <title>Happy Birthday, Sannidhi</title>
  <meta name="description" content="We managed to hide your voice inside a piece of wood.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page-shell">
    
    <section class="section hero reveal">
      <span class="accent-text" id="heroAccent"></span>
      <h1 id="heroTitle"></h1>
      <p class="subtitle" id="heroSubtitle"></p>
      <p class="hero-note" id="heroNote"></p>
      
      <article class="player-card">
        <div class="player-header">
          <span class="accent-text">Now Playing</span>
          <div class="status-dot" id="statusDot"></div>
        </div>
        <h2 id="playerTitle"></h2>
        <p class="caption" id="playerCaption"></p>
        
        <div class="wooden-wave" id="waveform"></div>

        <div class="player-controls">
          <button class="play-btn invite-tap" id="playToggle" aria-label="Play song">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          
          <div class="timeline-wrap">
            <input type="range" id="seekBar" class="seek-bar" value="0" min="0" max="100" step="0.1">
            <div class="time-row">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>
        </div>
      </article>
    </section>

    <section class="section art-section reveal">
      <span class="accent-text" id="storyAccent"></span>
      <h2 id="storyTitle"></h2>
      <div class="story-text" id="storyContainer"></div>
    </section>

    <section class="section lyrics-section reveal">
      <div class="lyrics-header">
        <div>
          <span class="accent-text" id="lyricsAccent"></span>
          <h2 id="lyricsTitle"></h2>
        </div>
        <button id="translateToggle" class="btn-outline small">Translation</button>
      </div>
      
      <div class="lyrics-box" id="lyricsContainer"></div>
    </section>

    <section class="section tribute-section reveal">
      <span class="accent-text" id="tributeAccent"></span>
      <h2 id="tributeTitle"></h2>
      
      <div class="photo-deck-container" id="photoDeck">
        <div class="deck-hint">Tap to flip</div>
      </div>

      <div class="story-text" id="tributeContainer"></div>

      <div class="instagram-link">
        <a id="instagramLink" href="#" target="_blank" rel="noopener" class="btn-outline">Visit her Instagram</a>
      </div>
    </section>

  </main>

  <audio id="song" src="" preload="metadata"></audio>

  <script src="script.js"></script>
  
</body>
</html>
